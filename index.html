<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campeonato dos Bichos — AABB</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LSRND84NDB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-LSRND84NDB');
</script>

</head>
<body>

  <header class="hero">
  <div class="hero-imagem"></div>

  <div class="hero-overlay"></div>

  <div class="hero-inner">
    <span class="clube">AABB</span>

    <h1>Campeonato dos Bichos</h1>

    <p class="subtitulo">
      Vôlei feminino · fase de grupos · 5 equipes
    </p>

    <div class="hero-stat">
      <span class="hero-stat-num">5</span>
      <span class="hero-stat-den">/10 jogos disputados</span>
    </div>
  </div>

  
</header>

  <main class="container">

    <section class="bloco">
      <div class="bloco-cabecalho">
        <h2>Classificação</h2>
        <p>Os 4 primeiros avançam à semifinal</p>
      </div>

      <div class="classificacao-quadro" id="classificacao">
        <!-- preenchido via script.js -->
      </div>

      <p class="legenda">Semifinais: 1º × 4º e 2º × 3º · pontos = sets vencidos no torneio</p>
    </section>

    <section class="bloco">
      <div class="bloco-cabecalho">
        <h2>Próximos jogos</h2>
        <p>Ginásio AABB</p>
      </div>

      <div class="jogos-lista" id="jogos">
        <!-- preenchido via script.js -->
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>Campeonato dos Bichos · Torneio Interno AABB</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
